name: Build Portal VPN APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize line endings and grant execute permission
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk portal-vpn-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk portal-vpn-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-vpn-release
          path: portal-vpn-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-vpn-debug
          path: portal-vpn-debug.apk
          if-no-files-found: error

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            portal-vpn-release.apk
            portal-vpn-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
